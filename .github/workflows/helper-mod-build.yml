name: Helper mod build

on:
  push:
    paths: ["minecraft-helper-mod/**", ".github/workflows/helper-mod-build.yml"]
  pull_request:
    paths: ["minecraft-helper-mod/**", ".github/workflows/helper-mod-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-helper-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: helper-mod-jar
          path: minecraft-helper-mod/build/libs/*.jar
