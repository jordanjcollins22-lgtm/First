name: Helper mod build

on:
  push:
    paths: ["minecraft-helper-mod/**", ".github/workflows/helper-mod-build.yml"]
  pull_request:
    paths: ["minecraft-helper-mod/**", ".github/workflows/helper-mod-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-helper-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Start a server with the mod and check it boots
        env:
          HELPERMOD_SMOKETEST: "1"
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-seed=1\n' > run/server.properties
          timeout 900 ./gradlew runServer --no-daemon --args=nogui 2>&1 | tee server.log | grep -E "ERROR|Exception|Caused by|Mixin|SMOKETEST|Done \(" || true
          grep -q "HELPERMOD SMOKETEST OK" server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helper-mod-jar
          path: minecraft-helper-mod/build/libs/*.jar
