name: CI

on:
  push:
  pull_request:

jobs:
  legal-guard:
    name: Legal text guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hashes match lock file
        run: node scripts/legal-hash.mjs --check
      - name: Legal changes went through the LEGAL flow
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/legal-guard.sh "$BASE_SHA" "$GITHUB_SHA"

  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    needs: legal-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
