name: Helper port probe

# Temporary helper for the 26.x port (removed when the port is done).
# - migrate: converts the 1.20.1 source from Yarn names to Mojang names and commits it to this branch.
# - lookup: prints class signatures (javap) from Minecraft 26.3 + Fabric API for names in port/queries.txt.
on:
  push:
    branches: ["claude/helper-latest-mc"]
    paths: [".github/workflows/helper-port-probe.yml", "minecraft-helper-mod/port/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: hashFiles('minecraft-helper-mod/port/migrate-now') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-helper-mod
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.20.1" --no-daemon
      - run: |
          rm -rf src/main/java && cp -r remappedSrc src/main/java && rm -rf remappedSrc port/migrate-now
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/main/java port
          git commit -m "Rename the source to Mojang's names (Loom migrateMappings, 1.20.1)"
          git push

  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: Stable Loom versions
        run: curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -vi -E 'snapshot|alpha|beta|rc' | sort -V | tail -5
      - name: Scratch project
        run: |
          mkdir p && cd p
          echo "pluginManagement { repositories { maven { url = 'https://maven.fabricmc.net/' }; gradlePluginPortal() } }" > settings.gradle
          cat > build.gradle <<'G'
          plugins { id 'net.fabricmc.fabric-loom' version '1.20.0-alpha.19' }
          dependencies {
            minecraft "com.mojang:minecraft:26.3"
            implementation "net.fabricmc:fabric-loader:0.20.1"
            implementation "net.fabricmc.fabric-api:fabric-api:0.165.2+26.3"
          }
          tasks.register('cp') { doLast { println "CP=" + sourceSets.main.compileClasspath.files.join(':') } }
          G
          gradle cp --no-daemon -q | grep '^CP=' | cut -d= -f2 > ../cp.txt
          tr ':' '\n' < ../cp.txt | grep -E 'minecraft|fabric' | head -5
      - name: Lookups
        run: |
          CP=$(cat cp.txt)
          Q=minecraft-helper-mod/port/queries.txt
          [ -f $Q ] || exit 0
          tr ':' '\n' < cp.txt | grep -E 'minecraft-merged|fabric-' > jars.txt
          for j in $(cat jars.txt); do unzip -Z1 "$j" '*.class' 2>/dev/null; done | grep -v '\$[0-9]' | sed 's/\.class$//' | sort -u > classes.txt
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              find\ *) p="${line#find }"; echo "=== FIND $p"; grep -E "$p" classes.txt | head -60 ;;
              *) echo "=== CLASS $line"; javap -cp "$CP" -p "$line" 2>&1 | head -400 ;;
            esac
          done < $Q
