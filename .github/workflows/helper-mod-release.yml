name: Helper mod release

# Pushing a tag like helper-v1.16.0 builds that commit and publishes the jar as a GitHub release.
# The mod's built-in updater downloads the newest helper-v* release on the next game start.
on:
  push:
    tags: ["helper-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-helper-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Check the tag matches mod_version
        run: |
          want="${GITHUB_REF_NAME#helper-v}"
          have="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          [ "$want" = "$have" ] || { echo "Tag $GITHUB_REF_NAME but mod_version is $have"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="$(ls build/libs/*.jar | grep -v sources | head -n1)"
          gh release delete "$GITHUB_REF_NAME" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" "$jar" --repo "$GITHUB_REPOSITORY" \
            --title "Helper Buddies ${GITHUB_REF_NAME#helper-v}" \
            --notes "Built from ${GITHUB_SHA}. Installed automatically by the mod's updater on the next game start." \
            --latest
